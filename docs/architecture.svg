<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 600" width="1000" height="600" role="img" aria-label="Dala Capital architecture: three roles and a backend on the left, two Anchor programs on the right, and the path money takes from an investor's exchange through program-owned addresses to the borrower and back to holders.">
  <style>
    text { font-family: ui-sans-serif, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    .ttl { font-size: 15px; font-weight: 650; fill: #24292f; }
    .sub { font-size: 11.5px; fill: #6e7781; }
    .sec { font-size: 11px; font-weight: 650; letter-spacing: .09em; fill: #8b949e; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 14px; font-weight: 600; fill: #24292f; }
    .box { fill: none; stroke: #d0d7de; }
    .prog { stroke: #4493f8; }
    .rule { stroke: #d0d7de; }
    @media (prefers-color-scheme: dark) {
      .ttl, .mono { fill: #e6edf3; }
      .sub { fill: #9198a1; }
      .box, .rule { stroke: #3d444d; }
      .prog { stroke: #4493f8; }
    }
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#8b949e"/>
    </marker>
  </defs>

  <!-- ─── roles → backend → programs ─── -->
  <text class="sec" fill="#8b949e" x="24" y="24">ROLES · PLATFORM · PROGRAMS</text>

  <rect class="box" x="24" y="44" width="176" height="60" rx="8" fill="none" stroke="#d0d7de" stroke-width="1.25"/>
  <text class="ttl" fill="#7d8590" x="40" y="70">Investor</text>
  <text class="sub" fill="#7d8590" x="40" y="88">no wallet, no signature</text>

  <rect class="box" x="24" y="116" width="176" height="60" rx="8" fill="none" stroke="#d0d7de" stroke-width="1.25"/>
  <text class="ttl" fill="#7d8590" x="40" y="142">Borrower</text>
  <text class="sub" fill="#7d8590" x="40" y="160">repays on schedule</text>

  <rect class="box" x="24" y="188" width="176" height="60" rx="8" fill="none" stroke="#d0d7de" stroke-width="1.25"/>
  <text class="ttl" fill="#7d8590" x="40" y="214">Administrator</text>
  <text class="sub" fill="#7d8590" x="40" y="232">issuer · registrar · paying agent</text>

  <line x1="200" y1="74" x2="246" y2="74" class="rule" stroke="#8b949e" stroke-width="1.25" marker-end="url(#a)"/>
  <line x1="200" y1="146" x2="246" y2="146" class="rule" stroke="#8b949e" stroke-width="1.25" marker-end="url(#a)"/>
  <line x1="200" y1="218" x2="246" y2="218" class="rule" stroke="#8b949e" stroke-width="1.25" marker-end="url(#a)"/>

  <rect class="box" x="252" y="44" width="196" height="204" rx="8" fill="none" stroke="#d0d7de" stroke-width="1.25"/>
  <text class="ttl" fill="#7d8590" x="270" y="74">Backend</text>
  <text class="sub" fill="#7d8590" x="270" y="104">mirrors the contract&#8217;s</text>
  <text class="sub" fill="#7d8590" x="270" y="120">arithmetic to the cent</text>
  <text class="sub" fill="#7d8590" x="270" y="146">KYC, documents, register</text>
  <text class="sub" fill="#7d8590" x="270" y="162">extracts, MT564 / MT566</text>
  <text class="sub" fill="#7d8590" x="270" y="188">signs with role keys:</text>
  <text class="sub" fill="#7d8590" x="270" y="204">registrar · issuer · operator</text>
  <text class="sub" fill="#7d8590" x="270" y="230">holds no claim of its own</text>

  <line x1="448" y1="92" x2="518" y2="92" class="rule" stroke="#8b949e" stroke-width="1.25" marker-end="url(#a)"/>
  <line x1="448" y1="200" x2="518" y2="200" class="rule" stroke="#8b949e" stroke-width="1.25" marker-end="url(#a)"/>

  <rect class="box prog" x="524" y="44" width="452" height="96" rx="8" fill="none" stroke="#4493f8" stroke-width="1.25"/>
  <text class="mono" fill="#7d8590" x="544" y="74">dala_capital</text>
  <text class="sub" fill="#7d8590" x="544" y="96">campaigns · deposits · schedules · repayment · prepayment</text>
  <text class="sub" fill="#7d8590" x="544" y="114">default and recovery &#8212; every movement of money</text>

  <rect class="box prog" x="524" y="152" width="452" height="96" rx="8" fill="none" stroke="#4493f8" stroke-width="1.25"/>
  <text class="mono" fill="#7d8590" x="544" y="182">dala_actions</text>
  <text class="sub" fill="#7d8590" x="544" y="204">Token-2022 notes with ISIN · record dates · register hashes</text>
  <text class="sub" fill="#7d8590" x="544" y="222">entitlements · votes · redemption &#8212; never moves funds</text>

  <line x1="288" y1="288" x2="976" y2="288" class="rule" stroke="#d0d7de" stroke-width="1" stroke-dasharray="3 4"/>

  <!-- ─── money path ─── -->
  <text class="sec" fill="#8b949e" x="24" y="324">MONEY PATH</text>

  <rect class="box" x="24" y="340" width="200" height="60" rx="8" fill="none" stroke="#d0d7de" stroke-width="1.25"/>
  <text class="ttl" fill="#7d8590" x="40" y="366">Exchange</text>
  <text class="sub" fill="#7d8590" x="40" y="384">investor sends USDC out</text>

  <line x1="224" y1="370" x2="268" y2="370" class="rule" stroke="#8b949e" stroke-width="1.25" marker-end="url(#a)"/>

  <rect class="box" x="274" y="340" width="200" height="60" rx="8" fill="none" stroke="#d0d7de" stroke-width="1.25"/>
  <text class="ttl" fill="#7d8590" x="290" y="366">Deposit address</text>
  <text class="sub" fill="#7d8590" x="290" y="384">PDA: campaign &#215; user</text>

  <line x1="474" y1="370" x2="518" y2="370" class="rule" stroke="#8b949e" stroke-width="1.25" marker-end="url(#a)"/>

  <rect class="box" x="524" y="340" width="200" height="60" rx="8" fill="none" stroke="#d0d7de" stroke-width="1.25"/>
  <text class="ttl" fill="#7d8590" x="540" y="366">Campaign vault</text>
  <text class="sub" fill="#7d8590" x="540" y="384">a position per investor</text>

  <line x1="724" y1="370" x2="768" y2="370" class="rule" stroke="#8b949e" stroke-width="1.25" marker-end="url(#a)"/>

  <rect class="box" x="774" y="340" width="202" height="60" rx="8" fill="none" stroke="#d0d7de" stroke-width="1.25"/>
  <text class="ttl" fill="#7d8590" x="790" y="366">Borrower</text>
  <text class="sub" fill="#7d8590" x="790" y="384">principal, less the fee</text>

  <rect class="box" x="24" y="424" width="200" height="60" rx="8" fill="none" stroke="#d0d7de" stroke-width="1.25"/>
  <text class="ttl" fill="#7d8590" x="40" y="450">Repayment</text>
  <text class="sub" fill="#7d8590" x="40" y="468">borrower pays into a PDA</text>

  <line x1="224" y1="454" x2="268" y2="454" class="rule" stroke="#8b949e" stroke-width="1.25" marker-end="url(#a)"/>

  <rect class="box" x="274" y="424" width="200" height="60" rx="8" fill="none" stroke="#d0d7de" stroke-width="1.25"/>
  <text class="ttl" fill="#7d8590" x="290" y="450">Four accumulators</text>
  <text class="sub" fill="#7d8590" x="290" y="468">principal · interest · penalty · fee</text>

  <line x1="474" y1="454" x2="518" y2="454" class="rule" stroke="#8b949e" stroke-width="1.25" marker-end="url(#a)"/>

  <rect class="box" x="524" y="424" width="200" height="60" rx="8" fill="none" stroke="#d0d7de" stroke-width="1.25"/>
  <text class="ttl" fill="#7d8590" x="540" y="450">Holder&#8217;s claim</text>
  <text class="sub" fill="#7d8590" x="540" y="468">derived, not iterated</text>

  <line x1="724" y1="454" x2="768" y2="454" class="rule" stroke="#8b949e" stroke-width="1.25" marker-end="url(#a)"/>

  <rect class="box" x="774" y="424" width="202" height="60" rx="8" fill="none" stroke="#d0d7de" stroke-width="1.25"/>
  <text class="ttl" fill="#7d8590" x="790" y="450">Approved address</text>
  <text class="sub" fill="#7d8590" x="790" y="468">the only way out</text>

  <text class="sub" fill="#7d8590" x="24" y="508">One transaction does all of the lower row: the borrower&#8217;s payment is allocated and credited to every holder at once, whatever their number.</text>

  <!-- ─── off chain ─── -->
  <rect class="box" x="24" y="528" width="952" height="56" rx="8" fill="none" stroke="#d0d7de" stroke-width="1.25" stroke-dasharray="5 4"/>
  <text class="ttl" fill="#7d8590" x="44" y="552">Off chain</text>
  <text class="sub" fill="#7d8590" x="44" y="570">Register extracts, ballots and documents are kept by the platform; the chain stores their SHA-256 hash, the record date and the settlement reference.</text>
</svg>
